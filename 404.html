<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página no encontrada — VELD</title>
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#1C1C1A" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,600&family=Gloock&family=Jost:wght@300;400;500&family=Jura:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --obsidian: #1C1C1A;
      --stone-white: #F5F2EC;
      --warm-sand: #D4C5A9;
      --ash: #8C8070;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: 'Jost', sans-serif;
      background: var(--obsidian);
      color: var(--stone-white);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }

    .nf-eyebrow {
      font-family: 'Jura', sans-serif;
      font-size: 10px;
      font-weight: 300;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--warm-sand);
      margin-bottom: 28px;
    }

    .nf-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(40px, 8vw, 96px);
      font-weight: 300;
      line-height: 1.05;
      letter-spacing: -0.01em;
      margin-bottom: 24px;
    }

    .nf-title em { font-style: italic; color: var(--warm-sand); }

    .nf-text {
      font-size: 14px;
      font-weight: 300;
      line-height: 1.9;
      color: var(--ash);
      max-width: 420px;
      letter-spacing: 0.02em;
      margin-bottom: 48px;
    }

    .nf-btn {
      font-family: 'Jura', sans-serif;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--obsidian);
      background: var(--warm-sand);
      padding: 16px 40px;
      text-decoration: none;
      transition: background 0.3s;
      display: inline-block;
    }

    .nf-btn:hover { background: var(--stone-white); }
  </style>
</head>
<body>
  <div class="nf-eyebrow">Error 404</div>
  <h1 class="nf-title">Esta página<br/><em>no existe.</em></h1>
  <p class="nf-text">El contenido que buscás se movió o nunca estuvo acá. Volvé al inicio para conocer a VELD.</p>
  <a href="/" class="nf-btn">Volver al inicio</a>
</body>
</html>
